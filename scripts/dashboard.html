<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --side: #eef0f3; --text: #1c2024; --muted: #636c76; --line: #e2e5e9;
    --hover: #e4e7eb; --sel: #dde7fb;
    --accent: #2f6fde; --on-accent: #ffffff;
    --done: #1f8a4c; --review: #b7791f; --blocked: #c53030; --wip: #636c76;
    --working: #2f6fde; --waiting: #1f8a4c; --idle: #9aa3ad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1e23; --side: #15181c; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a3038;
      --hover: #222830; --sel: #1e2a40;
      --accent: #6d9eff; --on-accent: #0b1220;
      --done: #48bb78; --review: #ecc94b; --blocked: #fc8181; --wip: #9aa3ad;
      --working: #6d9eff; --waiting: #48bb78; --idle: #5c6670;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  button { font: inherit; color: inherit; }

  .layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
  body.side-closed .layout { grid-template-columns: minmax(0, 1fr); }
  body.side-closed aside { display: none; }

  /* Sidebar */
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { font-size: 16px; font-weight: 700; padding: 0 8px 12px; }
  .nav { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; text-align: left; }
  .nav:hover { background: var(--hover); }
  .nav.sel { background: var(--sel); }
  .nav .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 12px; font-weight: 600; color: var(--review); }
  .group { margin-top: 14px; }
  .group-title { font-weight: 600; }
  .sess { padding-left: 14px; align-items: flex-start; }
  .sess .grow { white-space: normal; }
  .sess .sname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .sub { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--idle); }
  .dot.working { background: var(--working); box-shadow: 0 0 0 3px color-mix(in srgb, var(--working) 25%, transparent); }
  .dot.waiting { background: var(--waiting); }
  .dot.ended { background: transparent; border: 1px solid var(--idle); }
  .ended-toggle { margin-top: 16px; color: var(--muted); font-size: 13px; }
  .legend { margin-top: 20px; padding: 0 8px; color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .dot { margin-top: 0; }
  .side-empty { color: var(--muted); font-size: 13px; padding: 8px; }

  /* Main */
  .main { min-width: 0; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 1; }
  .toggle { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; color: var(--muted); }
  .toggle:hover { color: var(--text); }
  header h1 { font-size: 15px; margin: 0; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header h1 .brand-inline { display: none; color: var(--muted); font-weight: 600; }
  body.side-closed header h1 .brand-inline { display: inline; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .filters button.on { border-color: var(--accent); color: var(--accent); }
  #cards { max-width: 860px; margin: 0 auto; padding: 16px 20px 40px; display: grid; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; }
  .s-done { color: var(--done); } .s-review { color: var(--review); } .s-blocked { color: var(--blocked); } .s-wip { color: var(--wip); }
  .title { font-weight: 600; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  ul { margin: 8px 0 0; padding-left: 20px; }
  .review { margin-top: 8px; border-left: 3px solid var(--review); padding-left: 10px; }
  .review b { font-size: 12px; color: var(--review); }
  .replies { margin-top: 10px; display: grid; gap: 4px; }
  .reply { font-size: 13px; color: var(--muted); }
  .reply b { color: var(--text); font-weight: 600; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  textarea { flex: 1; min-width: 0; resize: vertical; min-height: 38px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); padding: 8px; font: inherit; }
  form button { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; border-radius: 8px; padding: 0 14px; cursor: pointer; }
  .closed { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .title { flex: 1; min-width: 0; }
  .card-act { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 6px; padding: 0 8px; font-size: 12px; cursor: pointer; }
  .card-act:hover { color: var(--text); border-color: var(--muted); }
  .badge.archived { color: var(--muted); }
  details { margin-top: 8px; }
  details summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
  .details-body { margin-top: 6px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; max-height: 420px; overflow-y: auto; }

  /* Search */
  .search { position: relative; flex: 0 1 260px; min-width: 140px; }
  .search input { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); padding: 0 28px 0 10px; font: inherit; }
  .search input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  .search kbd { position: absolute; right: 8px; top: 7px; font: 11px/16px ui-monospace, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; pointer-events: none; }
  .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }
  .mode-bar { max-width: 860px; margin: 0 auto; padding: 12px 20px 0; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .mode-bar button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
  .mode-bar:empty { display: none; }
  .archive-link { margin-top: 16px; color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }

  /* Narrow screens: sidebar sits above the cards */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .legend { display: none; }
    header { padding: 10px 16px; }
    #cards { padding: 12px 16px 32px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside id="side"></aside>
  <div class="main">
    <header>
      <button class="toggle" id="toggle" title="Toggle sidebar ( [ )" aria-label="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M6 3v10"/></svg>
      </button>
      <h1><span class="brand-inline">DDashboard / </span><span id="scope">All</span></h1>
      <div class="search">
        <input id="q" type="search" placeholder="Search cards" aria-label="Search cards" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="filters" id="filters"></div>
    </header>
    <div class="mode-bar" id="mode"></div>
    <div id="cards"></div>
  </div>
</div>
<script>
const STATUS = { review: 'Needs review', blocked: 'Blocked', wip: 'In progress', done: 'Done' };
const VIEW = { working: 'Working', waiting: 'Listening', idle: 'Idle', ended: 'Ended' };
const URGENT = new Set(['review', 'blocked']);

// Per-viewer UI state (best effort: storage may be unavailable)
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('ddash.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ddash.' + k, JSON.stringify(v)); } catch {} },
};
const narrow = matchMedia('(max-width: 760px)');
const sideKey = () => (narrow.matches ? 'sideOpenNarrow' : 'sideOpen');

let scope = store.get('scope', { kind: 'all' }); // { kind: 'all' | 'project' | 'session', id }
let filter = store.get('filter', 'all');
let showEnded = store.get('showEnded', false);
let drafts = {};
let state = { sessions: {}, cards: [], replies: [], last_by_session: {}, archived_count: 0 };

// Search / archive view. results is null while not searching (or while the first search is loading).
let query = '';
let archivedView = false;
let results = null;
let searchError = '';
let searchSeq = 0;
let searchTimer = 0;
const overrides = {};          // card_id -> archived, applied optimistically until the server catches up
const openDetails = new Set(); // card ids whose Details section is expanded
const searching = () => Boolean(query) || archivedView;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const time = (iso) => new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
};

function applySide() {
  document.body.classList.toggle('side-closed', !store.get(sideKey(), !narrow.matches));
}
function toggleSide(open) {
  const next = open ?? document.body.classList.contains('side-closed');
  store.set(sideKey(), next);
  applySide();
}

// A session needs you when its latest card is "needs review" or "blocked".
// last_by_session covers archived and older cards too; fall back to cards for 0.1.0 servers.
function urgentBySession() {
  let last = state.last_by_session;
  if (!last) {
    last = {};
    for (const c of state.cards) last[c.session_id] = c;
  }
  const out = {};
  for (const [sid, c] of Object.entries(last)) if (URGENT.has(c.status)) out[sid] = 1;
  return out;
}

function inScope(c) {
  if (scope.kind === 'session') return c.session_id === scope.id;
  if (scope.kind === 'project') return (state.sessions[c.session_id]?.project || c.project) === scope.id;
  return true;
}

function renderSide() {
  const sessions = Object.values(state.sessions);
  const urgent = urgentBySession();
  const ended = sessions.filter((s) => s.view === 'ended');
  const visible = showEnded ? sessions : sessions.filter((s) => s.view !== 'ended');

  const groups = {};
  for (const s of visible) (groups[s.project] ||= []).push(s);
  const order = { working: 0, waiting: 1, idle: 2, ended: 3 };
  const totalUrgent = Object.keys(urgent).length;

  const sel = (kind, id) => (scope.kind === kind && (kind === 'all' || scope.id === id) ? 'sel' : '');
  let html = `<div class="brand">DDashboard</div>
    <button class="nav ${sel('all')}" data-kind="all"><span class="grow">All</span>${totalUrgent ? `<span class="count">${totalUrgent}</span>` : ''}</button>`;

  const names = Object.keys(groups).sort();
  if (!names.length) html += `<div class="side-empty">No connected sessions.<br>Type <code>/ddashboard:dashboard</code> in a project.</div>`;
  for (const p of names) {
    const list = groups[p].sort((a, b) => order[a.view] - order[b.view] || a.name.localeCompare(b.name));
    const pu = list.filter((s) => urgent[s.session_id]).length;
    html += `<div class="group">
      <button class="nav group-title ${sel('project', p)}" data-kind="project" data-id="${esc(p)}"><span class="grow">${esc(p)}</span>${pu ? `<span class="count">${pu}</span>` : ''}</button>
      ${list.map((s) => `
        <button class="nav sess ${sel('session', s.session_id)}" data-kind="session" data-id="${esc(s.session_id)}" title="${esc(s.cwd)}">
          <span class="dot ${s.view}"></span>
          <span class="grow">
            <span class="sname">${esc(s.name)}${urgent[s.session_id] ? ' <span class="count">needs you</span>' : ''}</span>
            <span class="sub">${esc(s.branch || '')} · ${VIEW[s.view]}${s.pending ? ` · ${s.pending} queued` : ''}${s.view === 'ended' ? '' : ` · ${ago(s.last_seen)}`}</span>
          </span>
        </button>`).join('')}
    </div>`;
  }
  if (ended.length) html += `<button class="nav ended-toggle" data-toggle-ended>${showEnded ? 'Hide ended sessions' : `Show ${ended.length} ended session${ended.length > 1 ? 's' : ''}`}</button>`;
  html += `<button class="nav archive-link ${archivedView ? 'sel' : ''}" data-archived><span class="grow">Archived (${state.archived_count || 0})</span></button>`;
  html += `<div class="legend">${Object.entries(VIEW).map(([k, v]) => `<span><span class="dot ${k}"></span>${v}</span>`).join('')}</div>`;
  document.getElementById('side').innerHTML = html;
}

// Cards for the current view, newest first.
function viewCards() {
  if (searching()) {
    if (!results) return null;
    return results
      .map((c) => (c.id in overrides ? { ...c, archived: overrides[c.id] } : c))
      .filter((c) => !archivedView || c.archived);
  }
  return state.cards.filter((c) => overrides[c.id] !== true).slice().reverse();
}

function cardHtml(c, byCard) {
  const sess = state.sessions[c.session_id];
  const open = sess && sess.view !== 'ended';
  const details = typeof c.details === 'string' && c.details.trim() ? c.details : '';
  return `
    <article class="card">
      <div class="card-head">
        <span class="badge s-${esc(c.status)}">${esc(STATUS[c.status] || c.status)}</span>
        ${c.archived ? '<span class="badge archived">Archived</span>' : ''}
        <span class="title">${esc(c.title)}</span>
        ${c.archived
          ? `<button class="card-act" data-unarchive="${esc(c.id)}" title="Move back to the recent list">Unarchive</button>`
          : `<button class="card-act" data-archive="${esc(c.id)}" title="Hide from the recent list">Archive</button>`}
      </div>
      <div class="meta">${esc(sess?.project || c.project || '')} · ${esc(c.session_name)} · ${esc(c.branch)} · ${time(c.ts)}${c.diffstat ? ' · ' + esc(c.diffstat) : ''}</div>
      ${c.summary?.length ? `<ul>${c.summary.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${c.review?.length ? `<div class="review"><b>Check</b><ul>${c.review.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${details ? `<details data-details="${esc(c.id)}"${openDetails.has(c.id) ? ' open' : ''}><summary>Details</summary><div class="details-body">${esc(details)}</div></details>` : ''}
      <div class="replies">${(byCard[c.id] || []).map((r) => `<div class="reply"><b>You</b> ${esc(r.text)} · ${time(r.ts)}</div>`).join('')}</div>
      ${open ? `<form data-sid="${esc(c.session_id)}" data-id="${esc(c.id)}" data-title="${esc(c.title)}">
        <textarea data-card="${esc(c.id)}" placeholder="Reply to this session…" title="Ctrl+Enter to send">${esc(drafts[c.id] || '')}</textarea>
        <button>Send</button>
      </form>` : `<div class="closed">This session has ended, so it can't receive replies.</div>`}
    </article>`;
}

function renderMain() {
  saveDrafts();
  const all = viewCards();
  const scoped = (all || []).filter(inScope);
  const counts = {};
  for (const c of scoped) counts[c.status] = (counts[c.status] || 0) + 1;
  document.getElementById('filters').innerHTML = [['all', 'All', scoped.length], ...Object.entries(STATUS).map(([k, v]) => [k, v, counts[k] || 0])]
    .map(([k, v, n]) => `<button class="${filter === k ? 'on' : ''}" data-f="${k}">${v} ${n}</button>`).join('');

  const s = scope.kind === 'session' ? state.sessions[scope.id] : null;
  const scopeName = scope.kind === 'all' ? 'All' : scope.kind === 'project' ? scope.id : s ? `${s.project} / ${s.name}` : 'Session';
  document.getElementById('scope').textContent = archivedView ? `${scopeName} · Archived` : scopeName;

  const list = scoped.filter((c) => filter === 'all' || c.status === filter);
  let mode = '';
  if (searching()) {
    const what = archivedView ? 'archived cards' : 'all cards';
    const status = searchError ? esc(searchError) : !all ? 'Searching…' : `${list.length} ${query ? 'result' : 'card'}${list.length === 1 ? '' : 's'}${query ? ` for “${esc(query)}”` : ''} in ${what}`;
    mode = `<span>${status}</span>
      ${query ? '<button data-clear-search>Clear search</button>' : ''}
      ${archivedView ? '<button data-archived>Back to recent</button>' : ''}`;
  }
  document.getElementById('mode').innerHTML = mode;

  const byCard = {};
  for (const r of state.replies) (byCard[r.card_id] ||= []).push(r);
  const empty = searching() ? (all ? (query ? 'No matching cards.' : 'No archived cards.') : '') : 'No cards to show.';
  document.getElementById('cards').innerHTML = list.length ? list.map((c) => cardHtml(c, byCard)).join('') : empty ? `<div class="empty">${empty}</div>` : '';
}

function saveDrafts() {
  document.querySelectorAll('textarea[data-card]').forEach((t) => (drafts[t.dataset.card] = t.value));
}

async function runSearch() {
  if (!searching()) { results = null; searchError = ''; return; }
  const seq = ++searchSeq;
  const params = new URLSearchParams({ q: query, archived: archivedView ? 'only' : 'include', limit: '100' });
  try {
    const res = await fetch('/api/search?' + params);
    const data = await res.json();
    if (seq !== searchSeq) return;
    if (!res.ok || !Array.isArray(data.cards)) throw new Error(data.error || res.status);
    results = data.cards;
    searchError = '';
  } catch {
    if (seq !== searchSeq) return;
    results = results || [];
    searchError = 'Search is not available. Is the dashboard server up to date?';
  }
}

async function load() {
  saveDrafts();
  try {
    state = await (await fetch('/api/state')).json();
  } catch { return; }
  if (scope.kind === 'session' && !state.sessions[scope.id]) scope = { kind: 'all' };
  await runSearch();
  renderSide();
  renderMain();
}

// Re-search now (new query or view), dropping results that belong to the old one.
async function refreshSearch() {
  clearTimeout(searchTimer);
  results = null;
  renderSide(); renderMain();
  await runSearch();
  renderMain();
}

async function setArchived(id, archived) {
  const had = id in overrides;
  const prev = overrides[id];
  const delta = archived ? 1 : -1;
  overrides[id] = archived;
  state.archived_count = Math.max(0, (state.archived_count || 0) + delta);
  renderSide(); renderMain();
  try {
    const res = await fetch('/api/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ card_id: id, archived }),
    });
    if (!res.ok) throw new Error(await res.text());
  } catch (err) {
    if (had) overrides[id] = prev; else delete overrides[id];
    state.archived_count = Math.max(0, state.archived_count - delta);
    renderSide(); renderMain();
    alert(`Could not ${archived ? 'archive' : 'unarchive'}: ${err.message}`);
    return;
  }
  load();
}

document.getElementById('toggle').addEventListener('click', () => toggleSide());
narrow.addEventListener('change', applySide);

const qInput = document.getElementById('q');
qInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const next = qInput.value.trim();
    if (next !== query) { query = next; refreshSearch(); }
  }, 300);
});
function clearSearch() {
  qInput.value = '';
  if (query) { query = ''; refreshSearch(); } else clearTimeout(searchTimer);
}

document.addEventListener('click', (e) => {
  const arch = e.target.closest('[data-archive], [data-unarchive]');
  if (arch) {
    if (arch.dataset.archive) setArchived(arch.dataset.archive, true);
    else setArchived(arch.dataset.unarchive, false);
    return;
  }
  if (e.target.closest('[data-archived]')) {
    archivedView = !archivedView;
    refreshSearch();
    if (narrow.matches && archivedView) toggleSide(false);
    return;
  }
  if (e.target.closest('[data-clear-search]')) { clearSearch(); return; }
  const nav = e.target.closest('[data-kind]');
  if (nav) {
    scope = nav.dataset.kind === 'all' ? { kind: 'all' } : { kind: nav.dataset.kind, id: nav.dataset.id };
    store.set('scope', scope);
    renderSide(); renderMain();
    if (narrow.matches) toggleSide(false); // on small screens, get out of the way after picking
    return;
  }
  if (e.target.closest('[data-toggle-ended]')) {
    showEnded = !showEnded; store.set('showEnded', showEnded); renderSide();
    return;
  }
  const f = e.target.closest('[data-f]')?.dataset.f;
  if (f) { filter = f; store.set('filter', filter); renderMain(); }
});

// Keep Details sections open across re-renders. ("toggle" doesn't bubble, so listen in the capture phase.)
document.addEventListener('toggle', (e) => {
  const id = e.target.dataset?.details;
  if (!id) return;
  if (e.target.open) openDetails.add(id); else openDetails.delete(id);
}, true);

document.addEventListener('keydown', (e) => {
  const typing = e.target.matches('textarea, input');
  const plain = !e.ctrlKey && !e.metaKey && !e.altKey;
  if (e.target === qInput && e.key === 'Escape') {
    e.preventDefault();
    if (qInput.value) clearSearch(); else qInput.blur();
  } else if (e.key === 'Enter' && e.ctrlKey && e.target.form) e.target.form.requestSubmit();
  else if (e.key === '/' && !typing && plain) { e.preventDefault(); qInput.focus(); qInput.select(); }
  else if (e.key === '[' && !typing && plain) toggleSide();
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const ta = form.querySelector('textarea');
  const text = ta.value.trim();
  if (!text) return;
  const res = await fetch('/api/reply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: form.dataset.sid, card_id: form.dataset.id, card_title: form.dataset.title, text }),
  });
  if (res.ok) { ta.value = ''; delete drafts[form.dataset.id]; load(); }
  else alert('Could not send: ' + (await res.text()));
});

applySide();
load();
// Don't re-render while a reply is being typed.
setInterval(() => { if (!document.activeElement?.matches('textarea')) load(); }, 3000);
</script>
</body>
</html>
