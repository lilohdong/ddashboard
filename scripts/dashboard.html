<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --side: #eef0f3; --text: #1c2024; --muted: #636c76; --line: #e2e5e9;
    --hover: #e4e7eb; --sel: #dde7fb;
    --accent: #2f6fde; --on-accent: #ffffff;
    --done: #1f8a4c; --review: #b7791f; --blocked: #c53030; --wip: #636c76;
    --working: #2f6fde; --waiting: #1f8a4c; --idle: #9aa3ad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1e23; --side: #15181c; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a3038;
      --hover: #222830; --sel: #1e2a40;
      --accent: #6d9eff; --on-accent: #0b1220;
      --done: #48bb78; --review: #ecc94b; --blocked: #fc8181; --wip: #9aa3ad;
      --working: #6d9eff; --waiting: #48bb78; --idle: #5c6670;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  button { font: inherit; color: inherit; }

  .layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
  body.side-closed .layout { grid-template-columns: minmax(0, 1fr); }
  body.side-closed aside { display: none; }

  /* Sidebar */
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { font-size: 16px; font-weight: 700; padding: 0 8px 12px; }
  .nav { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; text-align: left; }
  .nav:hover { background: var(--hover); }
  .nav.sel { background: var(--sel); }
  .nav .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 12px; font-weight: 600; color: var(--review); }
  .group { margin-top: 14px; }
  .group-title { font-weight: 600; }
  .sess { padding-left: 14px; align-items: flex-start; }
  .sess .grow { white-space: normal; }
  .sess .sname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .sub { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--idle); }
  .dot.working { background: var(--working); box-shadow: 0 0 0 3px color-mix(in srgb, var(--working) 25%, transparent); }
  .dot.waiting { background: var(--waiting); }
  .dot.ended { background: transparent; border: 1px solid var(--idle); }
  .ended-toggle { margin-top: 16px; color: var(--muted); font-size: 13px; }
  .legend { margin-top: 20px; padding: 0 8px; color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .dot { margin-top: 0; }
  .side-empty { color: var(--muted); font-size: 13px; padding: 8px; }
  .sess .usage { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .sess .usage .warn { color: var(--blocked); font-weight: 600; }
  .today { margin-top: 16px; padding: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .today b { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }
  .today .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .today .row span:last-child { color: var(--text); }

  /* Team mode */
  .group-head { display: flex; align-items: center; gap: 4px; }
  .group-head .nav { flex: 1; min-width: 0; }
  .mode-sel { flex: none; max-width: 120px; font: inherit; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 2px; cursor: pointer; }
  .sess.member { padding-left: 30px; }
  .sess.depth2 { padding-left: 46px; }
  .ghead { display: flex; align-items: center; gap: 4px; padding: 4px 8px 2px 30px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .ghead .gname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghead .gname.unassigned { font-weight: 400; font-style: italic; }
  .ghead .sess-act { margin-top: 0; }
  .side-act.depth2, .spawn-form.depth2 { padding-left: 46px; }
  .group-del { margin: 2px 8px 6px 30px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; display: grid; gap: 6px; }
  .group-del label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .group-del .row { display: flex; gap: 6px; }
  .group-del button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
  .group-del button.danger { color: var(--blocked); border-color: currentColor; }
  .tag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 2px; white-space: nowrap; }
  .tag.lead { color: var(--accent); border-color: currentColor; }
  .tag.warn, .badge.warn { color: var(--blocked); border-color: currentColor; }
  .card.report { opacity: 0.6; }
  .badge.report { color: var(--muted); }
  .pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .pill.on { border-color: var(--accent); color: var(--accent); }
  .lang-sel { height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; padding: 0 4px; cursor: pointer; }
  .sess-row { display: flex; align-items: flex-start; gap: 2px; }
  .sess-row > .nav { flex: 1; min-width: 0; }
  .sess-act { flex: none; margin-top: 6px; border: 1px solid transparent; background: none; color: var(--muted); border-radius: 6px; padding: 0 6px; font-size: 12px; cursor: pointer; }
  .sess-act:hover { color: var(--text); border-color: var(--line); }
  .sid { color: var(--muted); font-size: 11px; font-weight: 400; font-family: ui-monospace, monospace; }
  .side-act { color: var(--muted); font-size: 12px; padding: 2px 8px 2px 30px; }
  .side-act.flat { padding-left: 14px; }
  .spawn-form { display: grid; gap: 6px; margin: 4px 0 6px; padding: 8px; padding-left: 30px; }
  .spawn-form input[type=text] { width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); padding: 0 8px; font: inherit; font-size: 13px; }
  .spawn-form textarea { min-height: 64px; font-size: 13px; }
  .spawn-form label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .spawn-form .row { display: flex; gap: 6px; }
  .spawn-form .row button { padding: 4px 12px; }
  .spawn-form .row button[type=button] { background: none; color: var(--muted); border: 1px solid var(--line); }

  /* Main */
  .main { min-width: 0; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 1; }
  .toggle { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; color: var(--muted); }
  .toggle:hover { color: var(--text); }
  header h1 { font-size: 15px; margin: 0; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header h1 .brand-inline { display: none; color: var(--muted); font-weight: 600; }
  body.side-closed header h1 .brand-inline { display: inline; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .filters button.on { border-color: var(--accent); color: var(--accent); }
  #cards { max-width: 860px; margin: 0 auto; padding: 16px 20px 40px; display: grid; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; }
  .s-done { color: var(--done); } .s-review { color: var(--review); } .s-blocked { color: var(--blocked); } .s-wip { color: var(--wip); }
  .title { font-weight: 600; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  ul { margin: 8px 0 0; padding-left: 20px; }
  .review { margin-top: 8px; border-left: 3px solid var(--review); padding-left: 10px; }
  .review b { font-size: 12px; color: var(--review); }
  .replies { margin-top: 10px; display: grid; gap: 4px; }
  .reply { font-size: 13px; color: var(--muted); }
  .reply b { color: var(--text); font-weight: 600; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  textarea { flex: 1; min-width: 0; resize: vertical; min-height: 38px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); padding: 8px; font: inherit; }
  form button { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; border-radius: 8px; padding: 0 14px; cursor: pointer; }
  .closed { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .title { flex: 1; min-width: 0; }
  .card-act { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 6px; padding: 0 8px; font-size: 12px; cursor: pointer; }
  .card-act:hover { color: var(--text); border-color: var(--muted); }
  .badge.archived { color: var(--muted); }
  .badge.answered { opacity: 0.55; }
  .badge.replied { color: var(--done); }
  details { margin-top: 8px; }
  details summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
  .details-body { margin-top: 6px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; max-height: 420px; overflow-y: auto; }

  /* Search */
  .search { position: relative; flex: 0 1 260px; min-width: 140px; }
  .search input { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); padding: 0 28px 0 10px; font: inherit; }
  .search input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  .search kbd { position: absolute; right: 8px; top: 7px; font: 11px/16px ui-monospace, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; pointer-events: none; }
  .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }
  .mode-bar { max-width: 860px; margin: 0 auto; padding: 12px 20px 0; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .mode-bar button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
  .mode-bar:empty { display: none; }
  .archive-link { margin-top: 16px; color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }

  /* Narrow screens: sidebar sits above the cards */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .legend { display: none; }
    header { padding: 10px 16px; }
    #cards { padding: 12px 16px 32px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside id="side"></aside>
  <div class="main">
    <header>
      <button class="toggle" id="toggle" data-i18n-title="side.toggle" data-i18n-aria="side.toggle" title="Toggle sidebar ( [ )" aria-label="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M6 3v10"/></svg>
      </button>
      <h1><span class="brand-inline">DDashboard / </span><span id="scope"></span></h1>
      <div class="search">
        <input id="q" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.placeholder" placeholder="Search cards" aria-label="Search cards" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="filters" id="filters"></div>
      <button class="pill" id="reports" hidden data-i18n-title="reports.title"></button>
      <select class="lang-sel" id="lang" data-i18n-title="lang.title" aria-label="Language"></select>
    </header>
    <div class="mode-bar" id="mode"></div>
    <div id="cards"></div>
  </div>
</div>
<script src="/i18n.js"></script>
<script>
// --- Language: saved choice (settings.json) > browser language > English ---
const I18N = window.DDASH_I18N;
let lang = I18N.pickLang(null, navigator.language);
const t = (key, vars) => I18N.translate(lang, key, vars);
const STATUS_KEYS = ['review', 'blocked', 'wip', 'done'];
const VIEW_KEYS = ['working', 'waiting', 'idle', 'ended'];
const statusName = (k) => (STATUS_KEYS.includes(k) ? t(`status.${k}`) : k);
const viewName = (k) => t(`view.${k}`);

// Text in the static markup (data-i18n-title / -placeholder / -aria) and the language picker.
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n-title]').forEach((el) => (el.title = t(el.dataset.i18nTitle)));
  document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => (el.placeholder = t(el.dataset.i18nPlaceholder)));
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  const sel = document.getElementById('lang');
  sel.innerHTML = Object.entries(I18N.LANGS).map(([k, v]) => `<option value="${k}"${k === lang ? ' selected' : ''}>${v}</option>`).join('');
}
const URGENT = new Set(['review', 'blocked']);

// Per-viewer UI state (best effort: storage may be unavailable)
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('ddash.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ddash.' + k, JSON.stringify(v)); } catch {} },
};
const narrow = matchMedia('(max-width: 760px)');
const sideKey = () => (narrow.matches ? 'sideOpenNarrow' : 'sideOpen');

let scope = store.get('scope', { kind: 'all' }); // { kind: 'all' | 'project' | 'session', id }
let filter = store.get('filter', 'all');
let showEnded = store.get('showEnded', false);
let showReports = store.get('showReports', false); // team mode: also show member reports (dimmed)
let spawnFor = null; // "<lead sid>|<group>" whose "+ member" form is open
let groupDel = null; // { project, name } whose delete confirmation is open
let spawnDraft = { role: '', model: '', stay: false, task: '' };
let drafts = {};
let state = { sessions: {}, cards: [], replies: [], last_by_session: {}, archived_count: 0 };

// Search / archive view. results is null while not searching (or while the first search is loading).
let query = '';
let archivedView = false;
let results = null;
let searchError = '';
let searchSeq = 0;
let searchTimer = 0;
const overrides = {};          // card_id -> archived, applied optimistically until the server catches up
const openDetails = new Set(); // card ids whose Details section is expanded
const searching = () => Boolean(query) || archivedView;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const time = (iso) => new Date(iso).toLocaleString(lang, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? t('ago.now') : m < 60 ? t('ago.m', { n: m }) : m < 1440 ? t('ago.h', { n: Math.round(m / 60) }) : t('ago.d', { n: Math.round(m / 1440) });
};

function applySide() {
  document.body.classList.toggle('side-closed', !store.get(sideKey(), !narrow.matches));
}
function toggleSide(open) {
  const next = open ?? document.body.classList.contains('side-closed');
  store.set(sideKey(), next);
  applySide();
}

// A session needs you when its latest card is "needs review" or "blocked".
// last_by_session covers archived and older cards too; fall back to cards for 0.1.0 servers.
// A "Needs review" or "Blocked" card counts as answered once you have replied to it.
const repliedIds = () => new Set(state.replies.map((r) => r.card_id));
const answered = (c, replied) => URGENT.has(c.status) && replied.has(c.id);

function urgentBySession() {
  let last = state.last_by_session;
  if (!last) {
    last = {};
    for (const c of state.cards) last[c.session_id] = c;
  }
  const replied = repliedIds();
  const out = {};
  for (const [sid, c] of Object.entries(last)) {
    // Archived cards and ended sessions no longer need you.
    const archived = c.id in overrides ? overrides[c.id] : c.archived;
    // Member reports go to their lead, so they don't need you either.
    if (archived || c.via_lead || state.sessions[sid]?.view === 'ended') continue;
    if (URGENT.has(c.status) && !answered(c, replied)) out[sid] = 1;
  }
  return out;
}

function inScope(c) {
  if (scope.kind === 'session') return c.session_id === scope.id;
  if (scope.kind === 'project') return (state.sessions[c.session_id]?.project || c.project) === scope.id;
  return true;
}

// Token usage (recorded by the Stop hook, no model calls).
const num = (v) => Number(v) || 0;
const fmtTok = (v) => {
  const n = num(v);
  if (n >= 1e6) return `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1)}M`;
  if (n >= 1e3) return `${Math.round(n / 1e3)}k`;
  return String(n);
};
const fullTok = (v) => num(v).toLocaleString(lang);
const sumTok = (u) => num(u?.input) + num(u?.cache_read) + num(u?.cache_write) + num(u?.output);

function usageTitle(u, extra = []) {
  return [...extra,
    `${t('usage.input')}: ${fullTok(u.input)}`,
    `${t('usage.cacheRead')}: ${fullTok(u.cache_read)}`,
    `${t('usage.cacheWrite')}: ${fullTok(u.cache_write)}`,
    `${t('usage.output')}: ${fullTok(u.output)}`,
    `${t('usage.turns')}: ${fullTok(u.turns)}`,
  ].join('\n');
}

function usageLine(s) {
  if (!s.usage && s.last_context == null) return '';
  const warnAt = num(state.context_warn) || 150000;
  const ctx = num(s.last_context);
  const warn = ctx > warnAt;
  const u = s.usage || {};
  const title = usageTitle(u, [`${t('usage.context', { n: fullTok(ctx) })}${warn ? t('usage.over', { n: fullTok(warnAt) }) : ''}`, t('usage.total', { n: fullTok(sumTok(u)) }), '']);
  return `<span class="usage" title="${esc(title)}"><span class="${warn ? 'warn' : ''}">ctx ${fmtTok(ctx)}</span> · ${fmtTok(sumTok(u))} tok</span>`;
}

function todayHtml() {
  const day = state.usage_today;
  if (!day) return '';
  const all = state.usage_total || {};
  const title = usageTitle(day, [t('usage.todayAll'), '']) + `\n\n${t('usage.allTime', { tokens: fullTok(sumTok(all)), turns: fullTok(all.turns) })}`;
  return `<div class="today" title="${esc(title)}"><b>${esc(t('usage.today'))}</b>
    <div class="row"><span>${esc(t('usage.input'))}</span><span>${fmtTok(day.input)}</span></div>
    <div class="row"><span>${esc(t('usage.cacheRead'))}</span><span>${fmtTok(day.cache_read)}</span></div>
    <div class="row"><span>${esc(t('usage.output'))}</span><span>${fmtTok(day.output)}</span></div>
  </div>`;
}

const teams = () => state.teams || {};
// A member of a live lead stays listed under it even when its own run has ended.
const underLead = (s) => s.team === 'member' && !s.lead_missing;

// Sidebar order in team mode: each lead followed by its members (indented), then everyone else.
// Rows: { s, depth } sessions, { ghead } group headers, { spawn } "+ member", { gtools } "+ group".
// With groups: lead > group > members, then "unassigned" for members without a (known) group.
function teamOrder(list, cmp, groupNames) {
  const byLead = {};
  for (const s of list) if (underLead(s)) (byLead[s.lead] ||= []).push(s);
  const out = [];
  for (const l of list.filter((s) => s.team === 'lead').sort(cmp)) {
    const live = l.view !== 'ended';
    const members = (byLead[l.session_id] || []).sort(cmp);
    delete byLead[l.session_id];
    out.push({ s: l, depth: 0 });
    if (!groupNames.length) {
      for (const m of members) out.push({ s: m, depth: 1 });
      if (live) out.push({ spawn: l.session_id, group: '', depth: 1 });
      if (live) out.push({ gtools: l.session_id });
      continue;
    }
    for (const g of groupNames) {
      const ms = members.filter((m) => m.group === g);
      out.push({ ghead: g, lead: l.session_id, count: ms.length, live });
      for (const m of ms) out.push({ s: m, depth: 2 });
      if (live) out.push({ spawn: l.session_id, group: g, depth: 2 });
    }
    const rest = members.filter((m) => !groupNames.includes(m.group));
    out.push({ ghead: '', lead: l.session_id, count: rest.length, live });
    for (const m of rest) out.push({ s: m, depth: 2 });
    if (live) out.push({ spawn: l.session_id, group: '', depth: 2 });
    if (live) out.push({ gtools: l.session_id });
  }
  for (const ms of Object.values(byLead)) for (const m of ms.sort(cmp)) out.push({ s: m, depth: 1 });
  for (const s of list.filter((x) => x.team !== 'lead' && !underLead(x)).sort(cmp)) out.push({ s, depth: 0 });
  return out;
}

function groupHeadHtml(r, p) {
  if (!r.ghead) return `<div class="ghead"><span class="gname unassigned">${esc(t('group.unassigned'))}</span><span>${r.count}</span></div>`;
  const acts = r.live ? `<button class="sess-act" data-group-rename="${esc(r.ghead)}" data-project="${esc(p)}" title="${esc(t('group.renameTitle'))}">${esc(t('group.rename'))}</button><button class="sess-act" data-group-del="${esc(r.ghead)}" data-project="${esc(p)}" title="${esc(t('group.deleteTitle'))}">${esc(t('group.delete'))}</button>` : '';
  const dir = teams()[p]?.groups?.[r.ghead]?.dir || '';
  let html = `<div class="ghead" title="${esc(dir)}"><span class="gname">${esc(r.ghead)}</span><span>${r.count}</span>${acts}</div>`;
  if (groupDel && groupDel.project === p && groupDel.name === r.ghead) {
    html += `<div class="group-del">${esc(t('group.deleteAsk', { name: r.ghead }))}
      <label><input type="checkbox" data-group-purge> ${esc(t('group.purge'))}</label>
      <div class="row"><button class="danger" data-group-del-ok>${esc(t('btn.delete'))}</button><button data-group-del-cancel>${esc(t('btn.cancel'))}</button></div>
    </div>`;
  }
  return html;
}

// solo / team switch next to the project name; choosing team picks the lead session.
const shortId = (sid) => String(sid).slice(0, 8);
const staleMin = () => num(state.stale_min) || 60;
const stale = (s) => !s.last_seen || Date.now() - new Date(s.last_seen) > staleMin() * 60000;

// "+ member" under a live lead in team mode, or its form when open.
function spawnHtml(lead, group = '', depth = 1) {
  const id = `${lead}|${group}`;
  const cls = depth > 1 ? ' depth2' : '';
  if (spawnFor !== id) return `<button class="nav side-act${cls}" data-spawn-for="${esc(id)}" title="${esc(group ? t('spawn.titleIn', { group }) : t('spawn.title'))}">${esc(t('spawn.button'))}</button>`;
  const d = spawnDraft;
  return `<form class="spawn-form${cls}" data-spawn="${esc(lead)}" data-group="${esc(group)}">
    <input type="text" name="role" placeholder="${esc(t('spawn.role'))}" value="${esc(d.role)}" required>
    <input type="text" name="model" placeholder="${esc(t('spawn.model'))}" value="${esc(d.model)}">
    <label><input type="checkbox" name="stay"${d.stay ? ' checked' : ''}> ${esc(t('spawn.stay'))}</label>
    <textarea name="task" placeholder="${esc(t('spawn.task'))}" required>${esc(d.task)}</textarea>
    <div class="row"><button>${esc(t('spawn.submit'))}</button><button type="button" data-spawn-cancel>${esc(t('btn.cancel'))}</button></div>
  </form>`;
}

// Session row actions: remove an ended session, or mark an idle, stale one as ended.
function sessAct(s) {
  if (s.view === 'ended') return `<button class="sess-act" data-forget="${esc(s.session_id)}" title="${esc(t('sess.forget'))}">×</button>`;
  if (s.view === 'idle' && stale(s)) return `<button class="sess-act" data-mark-ended="${esc(s.session_id)}" title="${esc(t('sess.markEndedTitle', { n: staleMin() }))}">${esc(t('sess.markEnded'))}</button>`;
  return '';
}

function modeSelect(p) {
  const tm = teams()[p];
  if (!tm) return '';
  // Lead candidates: live sessions, newest first, labelled so same-named sessions can be told apart.
  // Sessions not seen for stale_min minutes go into a "stale" group. Only the current lead is ever preselected.
  const live = Object.values(state.sessions).filter((s) => s.project === p && s.view !== 'ended')
    .sort((a, b) => String(b.last_seen).localeCompare(String(a.last_seen)));
  const value = tm.mode === 'team' ? `team:${tm.lead}` : 'solo';
  const opt = (v, label) => `<option value="${esc(v)}"${v === value ? ' selected' : ''}>${esc(label)}</option>`;
  const label = (s) => `${t('mode.team')} · ${s.name} · ${shortId(s.session_id)} · ${ago(s.last_seen)}`;
  const fresh = live.filter((s) => !stale(s));
  const old = live.filter(stale);
  let html = opt('solo', t('mode.solo')) + fresh.map((s) => opt(`team:${s.session_id}`, label(s))).join('');
  if (old.length) html += `<optgroup label="${esc(t('mode.stale', { n: staleMin() }))}">${old.map((s) => opt(`team:${s.session_id}`, label(s))).join('')}</optgroup>`;
  if (tm.mode === 'team' && !live.some((s) => s.session_id === tm.lead)) html += opt(value, `${t('mode.team')} · ${tm.lead_name || t('tag.lead')} · ${shortId(tm.lead || '')} ${t('mode.ended')}`);
  return `<select class="mode-sel" data-mode-key="${esc(tm.key)}" data-project="${esc(p)}" title="${esc(t('mode.title'))}">${html}</select>`;
}

function sessTags(s, tm) {
  if (tm?.mode !== 'team') return '';
  if (s.team === 'lead') {
    const limit = num(state.lead_context_limit) || 150000;
    const over = num(s.last_context) > limit ? ` <span class="tag warn" title="${esc(t('tag.handoffTitle', { n: fullTok(limit) }))}">${esc(t('tag.handoff'))}</span>` : '';
    return ` <span class="tag lead" title="${esc(t('tag.leadTitle'))}">${esc(t('tag.lead'))}${tm.lead_name ? ` · ${esc(tm.lead_name)}` : ''}</span>${over}`;
  }
  if (s.team === 'member') return ` <span class="tag" title="${esc(t('tag.roleTitle'))}">${esc(s.role || t('tag.member'))}</span>${s.lead_missing ? ` <span class="tag warn" title="${esc(t('tag.leadMissingTitle'))}">${esc(t('tag.leadMissing'))}</span>` : ''}`;
  return ` <span class="tag" title="${esc(t('tag.outsideTitle'))}">${esc(t('tag.outside'))}</span>`;
}

function renderSide() {
  const sessions = Object.values(state.sessions);
  const urgent = urgentBySession();
  const shown = (s) => showEnded || s.view !== 'ended' || underLead(s);
  const ended = sessions.filter((s) => s.view === 'ended' && !underLead(s));
  const visible = sessions.filter(shown);

  const groups = {};
  for (const s of visible) (groups[s.project] ||= []).push(s);
  const order = { working: 0, waiting: 1, idle: 2, ended: 3 };
  const totalUrgent = Object.keys(urgent).length;

  const sel = (kind, id) => (scope.kind === kind && (kind === 'all' || scope.id === id) ? 'sel' : '');
  let html = `<div class="brand">DDashboard</div>
    <button class="nav ${sel('all')}" data-kind="all"><span class="grow">${esc(t('all'))}</span>${totalUrgent ? `<span class="count">${totalUrgent}</span>` : ''}</button>`;

  const names = Object.keys(groups).sort();
  if (!names.length) html += `<div class="side-empty">${t('side.empty')}</div>`;
  for (const p of names) {
    const cmp = (a, b) => order[a.view] - order[b.view] || String(a.name).localeCompare(String(b.name));
    const tm = teams()[p];
    const groupNames = Object.keys(tm?.groups || {}).sort();
    const list = tm?.mode === 'team' ? teamOrder(groups[p], cmp, groupNames) : groups[p].sort(cmp).map((s) => ({ s, depth: 0 }));
    const sessRows = list.filter((r) => r.s);
    const pu = sessRows.filter((r) => urgent[r.s.session_id]).length;
    const nameCount = {};
    for (const { s } of sessRows) nameCount[s.name] = (nameCount[s.name] || 0) + 1;
    const endedHere = sessions.filter((s) => s.project === p && s.view === 'ended').length;
    html += `<div class="group">
      <div class="group-head">
        <button class="nav group-title ${sel('project', p)}" data-kind="project" data-id="${esc(p)}"><span class="grow">${esc(p)}</span>${pu ? `<span class="count">${pu}</span>` : ''}</button>
        ${modeSelect(p)}
      </div>
      ${list.map((r) => {
        if (r.ghead != null) return groupHeadHtml(r, p);
        if (r.spawn) return spawnHtml(r.spawn, r.group, r.depth);
        if (r.gtools) return `<button class="nav side-act" data-group-add="${esc(p)}" title="${esc(t('group.addTitle'))}">${esc(t('group.add'))}</button>`;
        const s = r.s;
        return `
        <div class="sess-row">
        <button class="nav sess${r.depth ? ' member' : ''}${r.depth > 1 ? ' depth2' : ''} ${sel('session', s.session_id)}" data-kind="session" data-id="${esc(s.session_id)}" title="${esc(s.cwd)}\n${esc(s.session_id)}">
          <span class="dot ${s.view}"></span>
          <span class="grow">
            <span class="sname">${esc(s.name)}${nameCount[s.name] > 1 ? ` <span class="sid">${shortId(s.session_id)}</span>` : ''}${sessTags(s, tm)}${s.unresponsive ? ` <span class="tag warn" title="${esc(t('side.unresponsiveTitle', { n: staleMin() }))}">${esc(t('side.unresponsive'))}</span>` : ''}${urgent[s.session_id] ? ` <span class="count">${esc(t('side.needsYou'))}</span>` : ''}</span>
            <span class="sub">${esc(s.branch || '')} · ${esc(viewName(s.view))}${s.pending ? ` · ${esc(t('side.queued', { n: s.pending }))}` : ''}${s.view === 'ended' ? '' : ` · ${ago(s.last_seen)}`}</span>
            ${usageLine(s)}
          </span>
        </button>${sessAct(s)}
        </div>`;
      }).join('')}
      ${endedHere ? `<button class="nav side-act flat" data-clear-ended="${esc(p)}" title="${esc(t('side.clearEndedTitle'))}">${esc(t('side.clearEnded', { n: endedHere }))}</button>` : ''}
    </div>`;
  }
  if (ended.length) html += `<button class="nav ended-toggle" data-toggle-ended>${esc(showEnded ? t('side.hideEnded') : t('side.showEnded', { n: ended.length }))}</button>`;
  html += `<button class="nav archive-link ${archivedView ? 'sel' : ''}" data-archived><span class="grow">${esc(t('side.archived', { n: state.archived_count || 0 }))}</span></button>`;
  html += todayHtml();
  html += `<div class="legend">${VIEW_KEYS.map((k) => `<span><span class="dot ${k}"></span>${esc(viewName(k))}</span>`).join('')}</div>`;
  document.getElementById('side').innerHTML = html;
}

// Cards for the current view, newest first.
function viewCards() {
  if (searching()) {
    if (!results) return null;
    return results
      .map((c) => (c.id in overrides ? { ...c, archived: overrides[c.id] } : c))
      .filter((c) => !archivedView || c.archived);
  }
  return state.cards.filter((c) => overrides[c.id] !== true).slice().reverse();
}

function cardHtml(c, byCard) {
  const sess = state.sessions[c.session_id];
  const open = sess && sess.view !== 'ended';
  const details = typeof c.details === 'string' && c.details.trim() ? c.details : '';
  const leadName = c.via_lead ? state.sessions[c.via_lead]?.name || t('tag.lead') : '';
  const replyBox = c.via_lead
    ? `<div class="closed">${esc(t('card.reportClosed', { name: leadName }))}</div>`
    : open ? `<form data-sid="${esc(c.session_id)}" data-id="${esc(c.id)}" data-title="${esc(c.title)}">
        <textarea data-card="${esc(c.id)}" placeholder="${esc(t('card.replyPlaceholder'))}" title="${esc(t('card.sendTitle'))}">${esc(drafts[c.id] || '')}</textarea>
        <button>${esc(t('card.send'))}</button>
      </form>` : `<div class="closed">${esc(t('card.closed'))}</div>`;
  return `
    <article class="card${c.via_lead ? ' report' : ''}">
      <div class="card-head">
        <span class="badge s-${esc(c.status)}${c.answered ? ' answered' : ''}">${esc(statusName(c.status))}</span>${c.answered ? `<span class="badge replied">${esc(t('card.replied'))}</span>` : ''}
        ${c.archived ? `<span class="badge archived">${esc(t('card.archived'))}</span>` : ''}
        ${c.via_lead ? `<span class="badge report">${esc(t('card.reportTo', { name: leadName }))}</span>` : ''}
        ${c.lead_missing ? `<span class="badge warn" title="${esc(t('card.leadMissingTitle'))}">${esc(t('card.leadMissing'))}</span>` : ''}
        <span class="title">${esc(c.title)}</span>
        ${c.archived
          ? `<button class="card-act" data-unarchive="${esc(c.id)}" title="${esc(t('card.unarchiveTitle'))}">${esc(t('card.unarchive'))}</button>`
          : `<button class="card-act" data-archive="${esc(c.id)}" title="${esc(t('card.archiveTitle'))}">${esc(t('card.archive'))}</button>`}
      </div>
      <div class="meta">${esc(sess?.project || c.project || '')} · ${esc(c.session_name)} · ${esc(c.branch)} · ${time(c.ts)}${c.diffstat ? ' · ' + esc(c.diffstat) : ''}</div>
      ${c.summary?.length ? `<ul>${c.summary.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${c.review?.length ? `<div class="review"><b>${esc(t('card.check'))}</b><ul>${c.review.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${details ? `<details data-details="${esc(c.id)}"${openDetails.has(c.id) ? ' open' : ''}><summary>${esc(t('card.details'))}</summary><div class="details-body">${esc(details)}</div></details>` : ''}
      <div class="replies">${(byCard[c.id] || []).map((r) => `<div class="reply"><b>${esc(t('card.you'))}</b> ${esc(r.text)} · ${time(r.ts)}</div>`).join('')}</div>
      ${replyBox}
    </article>`;
}

function renderMain() {
  saveDrafts();
  const all = viewCards();
  const scoped = (all || []).filter(inScope);
  const counts = {};
  const replied = repliedIds();
  for (const c of scoped) c.answered = answered(c, replied);
  for (const c of scoped) if (!c.answered) counts[c.status] = (counts[c.status] || 0) + 1;
  document.getElementById('filters').innerHTML = [['all', t('all'), scoped.length], ...STATUS_KEYS.map((k) => [k, statusName(k), counts[k] || 0])]
    .map(([k, v, n]) => `<button class="${filter === k ? 'on' : ''}" data-f="${k}">${esc(v)} ${n}</button>`).join('');

  const s = scope.kind === 'session' ? state.sessions[scope.id] : null;
  const scopeName = scope.kind === 'all' ? t('all') : scope.kind === 'project' ? scope.id : s ? `${s.project} / ${s.name}` : t('scope.session');
  document.getElementById('scope').textContent = archivedView ? t('scope.archived', { scope: scopeName }) : scopeName;

  const list = scoped.filter((c) => filter === 'all' || (c.status === filter && !c.answered));
  let mode = '';
  if (searching()) {
    const where = archivedView ? t('search.inArchived') : t('search.inAll');
    const status = searchError ? t('search.unavailable') : !all ? t('search.searching')
      : query ? t('search.results', { q: query, where, n: list.length }) : t('search.count', { where, n: list.length });
    mode = `<span>${esc(status)}</span>
      ${query ? `<button data-clear-search>${esc(t('search.clear'))}</button>` : ''}
      ${archivedView ? `<button data-archived>${esc(t('search.back'))}</button>` : ''}`;
  }
  document.getElementById('mode').innerHTML = mode;

  const rep = document.getElementById('reports');
  rep.hidden = !Object.values(teams()).some((t) => t.mode === 'team');
  rep.classList.toggle('on', showReports);
  rep.textContent = showReports ? t('reports.shown') : t('reports.hidden');

  const byCard = {};
  for (const r of state.replies) (byCard[r.card_id] ||= []).push(r);
  const empty = searching() ? (all ? (query ? t('empty.noMatch') : t('empty.noArchived')) : '') : t('empty.none');
  document.getElementById('cards').innerHTML = list.length ? list.map((c) => cardHtml(c, byCard)).join('') : empty ? `<div class="empty">${esc(empty)}</div>` : '';
}

function saveDrafts() {
  document.querySelectorAll('textarea[data-card]').forEach((t) => (drafts[t.dataset.card] = t.value));
}

async function runSearch() {
  if (!searching()) { results = null; searchError = ''; return; }
  const seq = ++searchSeq;
  const params = new URLSearchParams({ q: query, archived: archivedView ? 'only' : 'include', limit: '100' });
  try {
    const res = await fetch('/api/search?' + params);
    const data = await res.json();
    if (seq !== searchSeq) return;
    if (!res.ok || !Array.isArray(data.cards)) throw new Error(data.error || res.status);
    results = data.cards;
    searchError = '';
  } catch {
    if (seq !== searchSeq) return;
    results = results || [];
    searchError = 'unavailable';
  }
}

async function load() {
  saveDrafts();
  try {
    state = await (await fetch(showReports ? '/api/state?reports=1' : '/api/state')).json();
  } catch { return; }
  const next = I18N.pickLang(state.settings?.lang, navigator.language);
  if (next !== lang) { lang = next; applyStatic(); }
  if (scope.kind === 'session' && !state.sessions[scope.id]) scope = { kind: 'all' };
  await runSearch();
  renderSide();
  renderMain();
}

// Re-search now (new query or view), dropping results that belong to the old one.
async function refreshSearch() {
  clearTimeout(searchTimer);
  results = null;
  renderSide(); renderMain();
  await runSearch();
  renderMain();
}

async function setArchived(id, archived) {
  const had = id in overrides;
  const prev = overrides[id];
  const delta = archived ? 1 : -1;
  overrides[id] = archived;
  state.archived_count = Math.max(0, (state.archived_count || 0) + delta);
  renderSide(); renderMain();
  try {
    const res = await fetch('/api/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ card_id: id, archived }),
    });
    if (!res.ok) throw new Error(await res.text());
  } catch (err) {
    if (had) overrides[id] = prev; else delete overrides[id];
    state.archived_count = Math.max(0, state.archived_count - delta);
    renderSide(); renderMain();
    alert(t(archived ? 'err.archive' : 'err.unarchive', { e: err.message }));
    return;
  }
  load();
}

document.getElementById('toggle').addEventListener('click', () => toggleSide());
narrow.addEventListener('change', applySide);

const qInput = document.getElementById('q');
qInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const next = qInput.value.trim();
    if (next !== query) { query = next; refreshSearch(); }
  }, 300);
});
function clearSearch() {
  qInput.value = '';
  if (query) { query = ''; refreshSearch(); } else clearTimeout(searchTimer);
}

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}

async function sideAction(e) {
  const el = e.target;
  const forget = el.closest('[data-forget]')?.dataset.forget;
  if (forget) { await post('/api/sessions/forget', { session_id: forget }); return true; }
  const mark = el.closest('[data-mark-ended]')?.dataset.markEnded;
  if (mark) {
    if (!confirm(t('sess.confirmMarkEnded', { name: state.sessions[mark]?.name || mark, id: shortId(mark) }))) return true;
    await post('/api/sessions/end', { session_id: mark });
    return true;
  }
  const clear = el.closest('[data-clear-ended]')?.dataset.clearEnded;
  if (clear) {
    if (!confirm(t('sess.confirmClearEnded', { project: clear }))) return true;
    await post('/api/sessions/forget', { project: clear, ended: true });
    return true;
  }
  const add = el.closest('[data-group-add]')?.dataset.groupAdd;
  if (add) {
    const name = prompt(t('group.newPrompt'));
    if (!name) return false;
    await post('/api/groups', { project: add, action: 'create', name: name.trim() });
    return true;
  }
  const ren = el.closest('[data-group-rename]');
  if (ren) {
    const next = prompt(t('group.renamePrompt', { name: ren.dataset.groupRename }), ren.dataset.groupRename);
    if (!next || next.trim() === ren.dataset.groupRename) return false;
    await post('/api/groups', { project: ren.dataset.project, action: 'rename', name: ren.dataset.groupRename, new_name: next.trim() });
    return true;
  }
  const del = el.closest('[data-group-del]');
  if (del) { groupDel = { project: del.dataset.project, name: del.dataset.groupDel }; renderSide(); return false; }
  if (el.closest('[data-group-del-cancel]')) { groupDel = null; renderSide(); return false; }
  if (el.closest('[data-group-del-ok]') && groupDel) {
    const purge = Boolean(el.closest('.group-del')?.querySelector('[data-group-purge]')?.checked);
    const g = groupDel;
    groupDel = null;
    await post('/api/groups', { project: g.project, action: 'delete', name: g.name, purge });
    return true;
  }
  const spawn = el.closest('[data-spawn-for]')?.dataset.spawnFor;
  if (spawn) { spawnFor = spawn; renderSide(); document.querySelector('.spawn-form input[name=role]')?.focus(); return false; }
  if (el.closest('[data-spawn-cancel]')) { spawnFor = null; spawnDraft = { role: '', model: '', stay: false, task: '' }; renderSide(); return false; }
  return null;
}

document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-forget], [data-mark-ended], [data-clear-ended], [data-spawn-for], [data-spawn-cancel], [data-group-add], [data-group-rename], [data-group-del], [data-group-del-ok], [data-group-del-cancel]')) {
    try { if (await sideAction(e)) load(); } catch (err) { alert(t('err.generic', { e: err.message })); }
    return;
  }
  const arch = e.target.closest('[data-archive], [data-unarchive]');
  if (arch) {
    if (arch.dataset.archive) setArchived(arch.dataset.archive, true);
    else setArchived(arch.dataset.unarchive, false);
    return;
  }
  if (e.target.closest('[data-archived]')) {
    archivedView = !archivedView;
    refreshSearch();
    if (narrow.matches && archivedView) toggleSide(false);
    return;
  }
  if (e.target.closest('[data-clear-search]')) { clearSearch(); return; }
  if (e.target.closest('#reports')) { showReports = !showReports; store.set('showReports', showReports); load(); return; }
  const nav = e.target.closest('[data-kind]');
  if (nav) {
    scope = nav.dataset.kind === 'all' ? { kind: 'all' } : { kind: nav.dataset.kind, id: nav.dataset.id };
    store.set('scope', scope);
    renderSide(); renderMain();
    if (narrow.matches) toggleSide(false); // on small screens, get out of the way after picking
    return;
  }
  if (e.target.closest('[data-toggle-ended]')) {
    showEnded = !showEnded; store.set('showEnded', showEnded); renderSide();
    return;
  }
  const f = e.target.closest('[data-f]')?.dataset.f;
  if (f) { filter = f; store.set('filter', filter); renderMain(); }
});

// Keep Details sections open across re-renders. ("toggle" doesn't bubble, so listen in the capture phase.)
document.addEventListener('toggle', (e) => {
  const id = e.target.dataset?.details;
  if (!id) return;
  if (e.target.open) openDetails.add(id); else openDetails.delete(id);
}, true);

document.addEventListener('keydown', (e) => {
  const typing = e.target.matches('textarea, input');
  const plain = !e.ctrlKey && !e.metaKey && !e.altKey;
  if (e.target === qInput && e.key === 'Escape') {
    e.preventDefault();
    if (qInput.value) clearSearch(); else qInput.blur();
  } else if (e.key === 'Enter' && e.ctrlKey && e.target.form) e.target.form.requestSubmit();
  else if (e.key === '/' && !typing && plain) { e.preventDefault(); qInput.focus(); qInput.select(); }
  else if (e.key === '[' && !typing && plain) toggleSide();
});

// solo / team switch (team: the chosen session becomes the lead)
// Language picker: saved for the dashboard and for new cards (settings.json), applied at once.
document.getElementById('lang').addEventListener('change', async (e) => {
  const prev = lang;
  lang = e.target.value;
  applyStatic(); renderSide(); renderMain();
  try {
    await post('/api/settings', { lang });
  } catch (err) {
    lang = prev;
    applyStatic(); renderSide(); renderMain();
    alert(t('err.lang', { e: err.message }));
  }
});

document.addEventListener('change', async (e) => {
  const sel = e.target.closest('select[data-mode-key]');
  if (!sel) return;
  const [mode, lead] = sel.value.split(':');
  const who = mode === 'team' ? state.sessions[lead]?.name || lead : '';
  const ask = mode === 'team'
    ? t('mode.confirmTeam', { project: sel.dataset.project, who })
    : t('mode.confirmSolo', { project: sel.dataset.project });
  if (!confirm(ask)) { sel.blur(); renderSide(); return; }
  const res = await fetch('/api/mode', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project: sel.dataset.modeKey, mode, lead }),
  });
  if (!res.ok) alert(t('err.switch', { e: await res.text() }));
  sel.blur();
  load();
});

// Keep the "+ member" form's values across sidebar re-renders.
document.addEventListener('input', (e) => {
  const f = e.target.closest('form[data-spawn]');
  if (!f) return;
  spawnDraft = { role: f.elements.role.value, model: f.elements.model.value, stay: f.elements.stay.checked, task: f.elements.task.value };
});

async function submitSpawn(form) {
  const body = { lead: form.dataset.spawn, group: form.dataset.group || undefined, role: form.elements.role.value.trim(), model: form.elements.model.value.trim() || undefined, stay: form.elements.stay.checked, task: form.elements.task.value.trim() };
  if (!body.role || !body.task) return;
  try {
    await post('/api/team/spawn', body);
  } catch (err) { alert(t('err.spawn', { e: err.message })); return; }
  spawnFor = null;
  spawnDraft = { role: '', model: '', stay: false, task: '' };
  load();
}

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  if (form.dataset.spawn) return submitSpawn(form);
  const ta = form.querySelector('textarea');
  const text = ta.value.trim();
  if (!text) return;
  const res = await fetch('/api/reply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: form.dataset.sid, card_id: form.dataset.id, card_title: form.dataset.title, text }),
  });
  if (res.ok) { ta.value = ''; delete drafts[form.dataset.id]; load(); }
  else alert(t('err.send', { e: await res.text() }));
});

applySide();
applyStatic();
load();
// Don't re-render while a reply is being typed.
setInterval(() => { if (!spawnFor && !groupDel && !document.activeElement?.matches('textarea, select, input')) load(); }, 3000);
</script>
